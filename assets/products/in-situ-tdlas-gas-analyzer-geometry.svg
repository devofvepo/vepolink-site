<svg xmlns="http://www.w3.org/2000/svg" width="1005" height="350" viewBox="0 0 1005 350" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">In-situ TDLAS installation geometry</title>
  <desc id="diagram-description">A one-side analyzer head sends a laser across the duct to a reflector. The return beam follows a folded measuring path back to the same head.</desc>
  <defs>
    <linearGradient id="duct-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e8df"/>
      <stop offset=".5" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#e8e8df"/>
    </linearGradient>
    <marker id="forward-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 9 4 0 8Z" fill="#5ac7dc"/>
    </marker>
    <marker id="return-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 9 4 0 8Z" fill="#9e68e6"/>
    </marker>
    <style>
      .label { fill:#1a2333; font:600 18px 'Geist Mono',monospace; letter-spacing:1.5px; }
      .detail { fill:#626d7d; font:500 14px 'Geist Mono',monospace; letter-spacing:1px; }
    </style>
  </defs>
  <text class="detail" x="34" y="175">IN-SITU</text>
  <text class="label" x="34" y="204">ONE SIDE</text>
  <text class="detail" x="390" y="68">MEASURING GAP · FOLDED PATH</text>
  <path d="M455 82V96M455 89H833M833 82V96" fill="none" stroke="#1a2333" stroke-width="2"/>
  <rect x="434" y="111" width="454" height="177" rx="3" fill="url(#duct-fill)" stroke="#a9afb5" stroke-width="2"/>
  <rect x="426" y="148" width="18" height="102" fill="#f7f6f2" stroke="#a9afb5" stroke-width="2"/>
  <rect x="211" y="135" width="215" height="125" rx="12" fill="#fafaf7" stroke="#a9afb5" stroke-width="2"/>
  <text class="label" x="235" y="184">ANALYZER HEAD</text>
  <text class="detail" x="235" y="216">TX · RX · REF CELL</text>
  <rect x="826" y="141" width="9" height="115" rx="3" fill="#b8bec3"/>
  <path d="M426 177H816" fill="none" stroke="#f36b76" stroke-width="3" marker-end="url(#forward-arrow)"/>
  <path d="M816 215H437" fill="none" stroke="#9e68e6" stroke-width="3" marker-end="url(#return-arrow)"/>
  <text class="detail" x="730" y="133">REFLECTOR</text>
  <text class="detail" x="738" y="318">DUCT / STACK</text>
</svg>
