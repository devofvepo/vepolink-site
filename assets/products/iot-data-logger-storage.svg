<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 136" role="img" aria-labelledby="title"><title id="title">Local TF and optional eMMC storage feeds configurable averaging and daily, weekly and monthly reports</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0l10 5L0 10z" fill="#329aaa"/></marker></defs><g font-family="monospace" font-size="12" fill="#172332"><rect x="10.0" y="22" width="137.33333333333334" height="92" rx="6" fill="#f6f6f0" stroke="#bcc5c6"/><text x="20.0" y="46" font-weight="600">LOCAL STORAGE</text><text x="20.0" y="68" font-size="11" fill="#536171">TF: up to 1 TB</text><text x="20.0" y="85" font-size="11" fill="#536171">15 GB eMMC</text><text x="20.0" y="102" font-size="11" fill="#536171">Optional</text><path d="M150.33333333333334 68h17" stroke="#329aaa" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="171.33333333333334" y="22" width="137.33333333333334" height="92" rx="6" fill="#eef6f5" stroke="#bcc5c6"/><text x="181.33333333333334" y="46" font-weight="600">AVERAGING</text><text x="181.33333333333334" y="68" font-size="11" fill="#536171">1 / 5 / 15 / 60</text><text x="181.33333333333334" y="85" font-size="11" fill="#536171">Minutes or custom</text><path d="M311.6666666666667 68h17" stroke="#329aaa" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="332.6666666666667" y="22" width="137.33333333333334" height="92" rx="6" fill="#f6f6f0" stroke="#bcc5c6"/><text x="342.6666666666667" y="46" font-weight="600">REPORTS</text><text x="342.6666666666667" y="68" font-size="11" fill="#536171">Daily / weekly</text><text x="342.6666666666667" y="85" font-size="11" fill="#536171">Monthly</text><text x="342.6666666666667" y="102" font-size="11" fill="#536171">Fault records</text></g></svg>