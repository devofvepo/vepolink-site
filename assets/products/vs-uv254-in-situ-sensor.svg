<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">VS-UV254 in-situ water quality sensor</title>
  <desc id="desc">A generic cylindrical direct-immersion sensor with an automatic wiper and sapphire measurement window.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#aeb6bd"/>
      <stop offset="0.18" stop-color="#f2f4f3"/>
