    <rect x="197" y="391" width="106" height="57" fill="url(#body)" stroke="#7c8790" stroke-width="2"/>
    <path d="M197 448 H303 C298 480 281 493 250 493 C219 493 202 480 197 448Z" fill="#89939b" stroke="#747f88" stroke-width="2"/>
