AWSTemplateFormatVersion: "2010-09-09"
Description: Vepolink static website on S3 and CloudFront.

Parameters:
  DomainName:
    Type: String
    Default: www.vepolink.com
  AlternateDomainName:
    Type: String
    Default: vepolink.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone id for vepolink.com.
  BucketName:
    Type: String
    Default: www.vepolink.com

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Ref AlternateDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref AlternateDomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CleanUrlsFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: vepolink-clean-urls
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URL support for Vepolink static site.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value;
          var uri = request.uri;
          var querystring = request.querystring || {};

          function querySuffix() {
            // CloudFront supplies URL-encoded query names and values; preserve them.
            var pairs = [];
            for (var key in querystring) {
              if (querystring[key].multiValue) {
                var values = querystring[key].multiValue;
                for (var i = 0; i < values.length; i++) {
                  pairs.push(key + "=" + values[i].value);
                }
              } else if (querystring[key].value === "") {
                pairs.push(key);
              } else {
                pairs.push(key + "=" + querystring[key].value);
              }
            }
            return pairs.length ? "?" + pairs.join("&") : "";
          }

          if (host === "vepolink.com") {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: {
                location: { value: "https://www.vepolink.com" + uri + querySuffix() }
              }
            };
          }

          if (uri === "/wqms" || uri === "/wqms/") {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: {
                location: { value: "/water-quality-monitoring/" + querySuffix() }
              }
            };
          }

          var deferredRoutes = ["/login", "/support", "/ops/support"];
          for (var routeIndex = 0; routeIndex < deferredRoutes.length; routeIndex++) {
            var route = deferredRoutes[routeIndex];
            if (uri === route || uri.indexOf(route + "/") === 0) {
              return {
                statusCode: 404,
                statusDescription: "Not Found",
                headers: {
                  "cache-control": { value: "no-store" },
                  "content-type": { value: "text/plain; charset=utf-8" },
                  "x-robots-tag": { value: "noindex, nofollow" }
                },
                body: "Not Found"
              };
            }
          }

          var lastSegment = uri.substring(uri.lastIndexOf("/") + 1);
          if (lastSegment && lastSegment.indexOf(".") === -1) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: {
                // Keep the redirect on this host, even for a repeated leading slash.
                location: { value: uri.replace(/^\/+/, "/") + "/" + querySuffix() }
              }
            };
          }

          if (uri.endsWith("/")) {
            request.uri = uri + "index.html";
          }

          return request;
        }

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: vepolink-security-headers
        Comment: Security and browser policy headers for Vepolink website.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://unpkg.com 'sha256-vmRo2sfv05K8lXssOpbIi297NGfWQmtzwTfgMk4mg18='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          FrameOptions:
            Override: true
            FrameOption: DENY
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Vepolink website
        Aliases:
          - !Ref DomainName
          - !Ref AlternateDomainName
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 0
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CleanUrlsFunction.FunctionARN

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  WwwAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AlternateDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AlternateDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  WebsiteUrl:
    Value: !Sub "https://${DomainName}/"
